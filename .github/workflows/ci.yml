name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Every job here only reads the checked out tree. Declared explicitly so the
# grant does not silently widen if the repository default is ever changed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is engines.node, the node:22-alpine production image, and what the
        # team runs locally. One entry because those three now agree. Add a
        # version here only when something is actually supposed to run on it.
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  format:
    name: format (changed files)
    # Pull requests only, where a merge base exists to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Scoped to files the pull request touches rather than the whole tree. 28
      # tracked files predate any formatting gate, and reformatting them here
      # would bury real diffs and conflict with the branches currently in
      # review. Whoever clears that backlog can widen this to
      # `prettier --check .` in one commit.
      #
      # No extension allowlist. Prettier decides what it can parse, so a file
      # type nobody thought to list cannot slip through ungated, and
      # --ignore-unknown skips the rest instead of failing on them.
      - name: Check formatting of changed files
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          list="$RUNNER_TEMP/changed-files"
          git diff --name-only --diff-filter=ACMR -z \
            "origin/${{ github.base_ref }}...HEAD" > "$list"
          if [ ! -s "$list" ]; then
            echo "No files changed."
            exit 0
          fi
          echo "Checking:"
          tr '\0' '\n' < "$list"
          xargs -0 -r -a "$list" npx prettier --check --ignore-unknown
