name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # An advisory gets published against a tree nobody has touched, so the audit
  # job needs a trigger that is not a diff. Note the limit before relying on it:
  # GitHub only runs scheduled workflows on the default branch, so this covers
  # main and nothing else until a branch lands there.
  schedule:
    - cron: '17 6 * * 1'

# Every job here only reads the checked out tree. Declared explicitly so the
# grant does not silently widen if the repository default is ever changed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is engines.node, the node:22-alpine production image, and what the
        # team runs locally. One entry because those three now agree. Add a
        # version here only when something is actually supposed to run on it.
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Kept out of `pnpm verify` on purpose. This is the one check that needs
      # the registry, and the local loop stays runnable on a train. The gate
      # fails on an advisory nobody has written down and equally on an allowlist
      # entry that has stopped matching, which is what stops the exception list
      # from quietly outliving its reasons.
      - name: Dependency advisories
        run: pnpm audit:check

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Whole tree. The 28 files that predated any formatting gate are clean as
      # of the sweep, so there is no backlog left to work around and no reason
      # to scope this to what a pull request happens to touch.
      #
      # Tracked files rather than `prettier --check .`, because a bare walk also
      # picks up untracked and gitignored paths like .vscode/settings.json and
      # so reports a number that depends on whose machine it ran on.
      # --ignore-unknown lets prettier skip what it cannot parse, which keeps
      # Dockerfiles and images from failing the job.
      - name: Check formatting
        run: git ls-files -z | xargs -0 -r npx prettier --check --ignore-unknown
