services:
  ome:
    image: airensoft/ovenmediaengine:latest
    container_name: ome
    env_file: ../../.env
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/ovenmediaengine/conf-template/entrypoint.sh"]
    volumes:
      - ./Server.xml.template:/opt/ovenmediaengine/conf-template/Server.xml.template:ro
      - ./entrypoint.sh:/opt/ovenmediaengine/conf-template/entrypoint.sh:ro
    ports:
      - "${OME_HLS_PORT:-8081}:8081"
      - "${OME_SRT_PORT:-10080}:10080/udp"
    environment:
      OME_ADAPTER_HOST: ${OME_ADAPTER_HOST:-host.docker.internal}
      OME_ADAPTER_PORT: ${OME_ADAPTER_PORT:-3000}
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
