services:
  srs:
    image: ossrs/srs:6
    container_name: srs
    restart: unless-stopped
    entrypoint: ['/bin/bash', '/usr/local/srs/conf/entrypoint.sh']
    volumes:
      - ./srs.conf.template:/usr/local/srs/conf/srs.conf.template:ro
      - ./entrypoint.sh:/usr/local/srs/conf/entrypoint.sh:ro
      - ./healthcheck.sh:/usr/local/srs/conf/healthcheck.sh:ro
      # HLS output — shared with the Node app's media directory
      - ${SRS_MEDIA_PATH:-./media}:/usr/local/srs/objs/nginx/html
    # Same port on both sides, because the entrypoint binds SRS to these values now, so a mapping
    # onto a fixed container port would point at nothing.
    #
    # The `environment:` block below is what makes that safe. Compose interpolates `${...}` in both
    # blocks from the **project's** env file, `.env` beside this compose file, so restating the three
    # port variables there is what keeps the port that gets published and the port SRS binds resolving
    # from one place. Without it an operator who sets either one gets an SRT socket with nothing
    # behind it.
    ports:
      - '${SRS_RTMP_PORT:-1935}:${SRS_RTMP_PORT:-1935}'
      - '1985:1985'
      - '${SRS_HTTP_PORT:-8080}:${SRS_HTTP_PORT:-8080}'
      - '${SRS_SRT_PORT:-10080}:${SRS_SRT_PORT:-10080}/udp'
    # Enumerated rather than inherited, deliberately. This used to be `env_file: ../../.env`, which
    # fills the container with **every** root variable, including PUBLISH_KEY_SECRET: the master
    # secret every stream's publish key derives from, handed to the third-party publisher-facing
    # image it exists to authenticate publishers against. Anyone who can read that environment mints
    # a valid key for every stream, and rotating is the only response because there is no per-stream
    # revocation. See SEC-28.
    #
    # This block is the same pattern deploy/docker-compose.yml already uses and says it uses: a
    # variable absent here is one the container never sees, however carefully an operator sets it.
    # The list is what this engine's entrypoint actually reads, and nothing else.
    environment:
      SRT_PASSPHRASE: ${SRT_PASSPHRASE:-}
      SRS_ADAPTER_HOST: ${SRS_ADAPTER_HOST:-stream-uploader}
      SRS_WEBHOOK_TOKEN: ${SRS_WEBHOOK_TOKEN:-}
      SRS_ADAPTER_PORT: ${SRS_ADAPTER_PORT:-3000}
      # Read by the entrypoint to write SRS's own `listen` directives. Same defaults and the same
      # interpolation source as the `ports:` block above, which is the whole point of restating them.
      SRS_RTMP_PORT: ${SRS_RTMP_PORT:-1935}
      SRS_HTTP_PORT: ${SRS_HTTP_PORT:-8080}
      SRS_SRT_PORT: ${SRS_SRT_PORT:-10080}
      # The latency knobs, restated here because this file is the one behind `pnpm srs:host` and
      # `pnpm srs:local`. `deploy/docker-compose.yml` gained them and this did not, so on the local
      # engine path every one of them was inert: setting `HLS_FRAGMENT=0.5` produced 1.0s segments
      # with nothing reporting a problem, because the entrypoint substituted its own default into a
      # template whose placeholder the variable never reached. Defaults are the same on both sides on
      # purpose, so which compose file started the engine cannot change the picture.
      #
      # This is the second time the two files have diverged over the same kind of change. OBS-20's
      # healthcheck went into one and not the other. Enumerating rather than inheriting is right, for
      # the SEC-28 reason above, and its cost is exactly this: a knob added to one list is missing
      # from the other until someone notices.
      #
      # ⛔ The `HLS_FRAGMENT=0.5 produced 1.0s segments` above had a second cause as well as the
      # placeholder bug, and the bug fix alone would not have delivered 0.5s segments: the segment is
      # `ceil(HLS_FRAGMENT / GOP) * GOP`, so a 1.0s publisher GOP yields 1.0s segments whatever the
      # fragment says. Both have to move.
      #
      # ⛔ The ratio is 5.0 rather than the 4.2 that held the product at SRS's own 2.1s ceiling,
      # because the ceiling has to clear `GOP + 0.135s` and not the GOP: a segment overshoots its
      # settled length by that constant before ramping back down. At 2.1 the common 2.0s GOP was
      # force-closed intermittently. 0.5 * 5.0 = 2.5s, the ceiling latbench has always run.
      HLS_FRAGMENT: ${HLS_FRAGMENT:-0.5}
      HLS_AOF_RATIO: ${HLS_AOF_RATIO:-5.0}
      HLS_WINDOW: ${HLS_WINDOW:-15}
      SRT_LATENCY: ${SRT_LATENCY:-200}
      # The ABR ladder, read by this entrypoint. Off by default.
      ABR_ENABLED: ${ABR_ENABLED:-false}
      ABR_LADDER: ${ABR_LADDER:-}
      ABR_VHOST: ${ABR_VHOST:-abr}
      ABR_FPS: ${ABR_FPS:-30}
      ABR_PRESET: ${ABR_PRESET:-veryfast}
      ABR_PROFILE: ${ABR_PROFILE:-main}
      ABR_THREADS: ${ABR_THREADS:-0}
      ABR_ACODEC: ${ABR_ACODEC:-copy}
      ABR_AUDIO_BITRATE: ${ABR_AUDIO_BITRATE:-128}
      # Empty on purpose: the entrypoint defaults it to the resolved SRS_RTMP_PORT, the RTMP listener
      # the transcode republish dials. Pinning a fixed port here would re-break the ladder under --portSlot.
      ABR_RTMP_PORT: ${ABR_RTMP_PORT:-}
    # Asks whether a broadcaster could reach this engine, not whether the process is alive. See
    # OBS-20 and the reasoning in `healthcheck.sh`: SRS ran 44 minutes with a dead SRT listener while
    # every signal the deployment had said it was fine.
    #
    # `start_period` covers the entrypoint templating the config and SRS binding, which is under a
    # second in practice. `retries: 2` because a UDP listener does not come and go: either the socket
    # is held or it is not, and a check that needs three tries to believe that is delaying the answer
    # rather than avoiding a false one.
    healthcheck:
      test: ['CMD', 'bash', '/usr/local/srs/conf/healthcheck.sh']
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
