x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '50m'
    max-file: '5'

services:
  # --- Bee Nodes ---

  bee-uploader:
    image: ethersphere/bee:2.8.2
    profiles: ['bee-uploader']
    restart: unless-stopped
    logging: *default-logging
    ports:
      # The API is an unauthenticated write surface — postage spend, chunk upload, feed writes —
      # so on any host with a public address it must be bound to one interface and firewalled.
      # P2P stays on every interface: that is how the node reaches Swarm.
      - '${BEE_UPLOADER_API_BIND:-0.0.0.0}:${BEE_UPLOADER_API_PORT:-1633}:${BEE_UPLOADER_API_PORT:-1633}'
      - '${BEE_UPLOADER_P2P_PORT:-1634}:${BEE_UPLOADER_P2P_PORT:-1634}'
    volumes:
      - ${BEE_UPLOADER_DATA_DIR:-${BEE_DATA_ROOT:-./data}/bee-uploader}:/home/bee/.bee
    command:
      - start
      # BEE_UPLOADER_API_LISTEN is the process's own bind address, and it is what protects the API
      # under COMPOSE_NETWORK=host, where published ports are ignored. Empty means every interface,
      # which is correct in bridge mode: there the published port above is the boundary.
      - --api-addr=${BEE_UPLOADER_API_LISTEN:-}:${BEE_UPLOADER_API_PORT:-1633}
      - --p2p-addr=:${BEE_UPLOADER_P2P_PORT:-1634}
      - --blockchain-rpc-endpoint=${RPC_ENDPOINT:-https://rpc.gnosischain.com}
      - --full-node=${BEE_UPLOADER_FULL_NODE:-false}
      - --swap-enable=true
      - --cors-allowed-origins=*
      - --verbosity=${BEE_VERBOSITY:-5}
      - --password-file=/home/bee/.bee/password

  bee-gateway:
    image: ethersphere/bee:2.8.2
    profiles: ['bee-gateway']
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Read-only in practice, but it can still spend nothing and serve anything: bind it to the
      # interface the client proxies from rather than to every address the host answers on.
      - '${BEE_GATEWAY_API_BIND:-0.0.0.0}:${BEE_GATEWAY_API_PORT:-1733}:${BEE_GATEWAY_API_PORT:-1733}'
      - '${BEE_GATEWAY_P2P_PORT:-1734}:${BEE_GATEWAY_P2P_PORT:-1734}'
    volumes:
      - ${BEE_GATEWAY_DATA_DIR:-${BEE_DATA_ROOT:-./data}/bee-gateway}:/home/bee/.bee
    command:
      - start
      - --api-addr=${BEE_GATEWAY_API_LISTEN:-}:${BEE_GATEWAY_API_PORT:-1733}
      - --p2p-addr=:${BEE_GATEWAY_P2P_PORT:-1734}
      - --blockchain-rpc-endpoint=${RPC_ENDPOINT:-https://rpc.gnosischain.com}
      - --full-node=false
      # false here plus --full-node=false is bee's `ultra-light` mode, which has no chequebook and
      # so no way to pay a peer for bandwidth. LAT-10: such a node lives on the free allowance
      # alone, and a viewer polling it sees the feed freeze 30 to 48s at a time. Turning this on
      # needs a reachable RPC endpoint and a funded wallet at the address `/addresses` reports as
      # `chain_address`, so it stays off by default and is opt-in per profile.
      - --swap-enable=${BEE_GATEWAY_SWAP_ENABLE:-false}
      # In PLUR, so a whole BZZ is 1e16. Bee's own default is 0, which deploys a chequebook that
      # can back no cheque at all, so swap-enable alone leaves the node just as unable to pay.
      # Only read when the chequebook is first deployed: changing it later moves nothing, and a
      # deployed chequebook is topped up through the node's /chequebook/deposit instead.
      - --swap-initial-deposit=${BEE_GATEWAY_SWAP_INITIAL_DEPOSIT:-0}
      # ⛔⛔ ZERO IS THE ONE VALUE THAT GUARANTEES A THRASH LOOP, so read this before changing it and
      # before quoting any cache figure gathered at it. Bee's cache Putter never tests capacity, so
      # chunks enter regardless; eviction triggers whenever size exceeds capacity, which at 0 is every
      # cached chunk; and every round then asks to drop at least `cacheMinEvictCount`, hard-coded at
      # 10,000 in bee with no flag. The counter undershoots into negative, and bee's guard
      # `if size <= capc { continue }` then stops eviction until ordinary caching lifts it back over 0.
      # Measured 2026-08-14: the gateway reports bee_localstore_cache_size -1844 with 2,989 eviction
      # rounds behind it, while the uploader on the same host at bee's default capacity reports +2962
      # and has never evicted once. So this node's cache is neither on nor off, it is a sawtooth whose
      # phase nothing records, and a measurement's exposure scales with how long it takes to gather.
      # ⚠️ Left at 0 because every sitting this project has run was gathered at 0 and moving it breaks
      # comparability AND restarts the gateway. docs/bench/the-gateway-cache-is-a-sawtooth-2026-08-14.md
      - --cache-capacity=${BEE_GATEWAY_CACHE_CAPACITY:-0}
      # ⛔ Capacity does NOT gate caching, and setting it to 0 never turned the cache off. Measured
      # 2026-08-10: with capacity 0 confirmed on the running container, a second walk of the same 1000
      # references moved the same 120 MB with a median of 4ms against 121ms on the first walk. Bee's
      # own help calls this flag "enable forwarded content caching (default true)", so every arm this
      # project ever labelled cache-off was measured with the cache on. Left at bee's default so
      # deployments are unchanged; an experiment that needs a cold node every pass sets it false.
      - --cache-retrieval=${BEE_GATEWAY_CACHE_RETRIEVAL:-true}
      - --cors-allowed-origins=*
      - --verbosity=${BEE_VERBOSITY:-5}
      - --password-file=/home/bee/.bee/password

  # --- Stream Uploader ---

  stream-uploader:
    image: stream-uploader
    build:
      context: ..
      dockerfile: deploy/Dockerfile.uploader
    profiles: ['stream-uploader']
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - uploader-state:/app/state
      - srs-media:/media
    environment:
      BEE_URL: ${BEE_URL:-http://bee-uploader:1633}
      STAMP: ${STAMP}
      BEE_PUBLISHERS: ${BEE_PUBLISHERS:-}
      CHEQUEBOOK_MIN_BZZ: ${CHEQUEBOOK_MIN_BZZ:-0.5}
      STREAM_KEY: ${STREAM_KEY}
      STREAM_LIST_TOPIC: ${STREAM_LIST_TOPIC:-swarm-stream}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
      SRS_WEBHOOK_TOKEN: ${SRS_WEBHOOK_TOKEN:-}
      # Only the uploader gets this, not the engines: it is what verifies a publish key, and neither
      # engine does anything with one beyond forwarding the query it arrived in. Empty disables
      # publisher authentication rather than rejecting everything, so an existing deployment keeps
      # working across the upgrade that introduced it. See SEC-28 and `publish-key.sh`.
      PUBLISH_KEY_SECRET: ${PUBLISH_KEY_SECRET:-}
      API_PORT: ${API_PORT:-3000}
      STATE_DIR: /app/state
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-100}
      RECOVERY_TIMEOUT: ${RECOVERY_TIMEOUT:-60000}
      SEGMENT_STALL_MS: ${SEGMENT_STALL_MS:-30000}
      SEGMENT_DEDUP_WINDOW: ${SEGMENT_DEDUP_WINDOW:-10000}
      ORPHAN_REAP_MS: ${ORPHAN_REAP_MS:-60000}
      SEGMENT_REDUNDANCY: ${SEGMENT_REDUNDANCY:-1}
      ENGINE: ${ENGINE:-srs}
      SRS_MEDIA_PATH: /media
      # The uploader reads the same ladder the engine was configured with: SRS's webhooks carry
      # the stream name and nothing else, so width, height and the encoder's target bitrate — all
      # of which the master playlist needs — only exist here.
      ABR_ENABLED: ${ABR_ENABLED:-false}
      ABR_LADDER: ${ABR_LADDER:-}
      ABR_VHOST: ${ABR_VHOST:-abr}
      OME_HLS_URL: ${OME_HLS_URL:-http://ome:8081}
      OME_HLS_POLL_INTERVAL_MS: ${OME_HLS_POLL_INTERVAL_MS:-500}
      OME_FETCH_TIMEOUT_MS: ${OME_FETCH_TIMEOUT_MS:-10000}
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET:-}
      OME_ADMISSION_FAIL_OPEN: ${OME_ADMISSION_FAIL_OPEN:-false}
      # This block enumerates rather than inherits, so a variable absent here is one the container
      # never sees however carefully an operator sets it in .env.
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-}
    # Something finally reads /health. Every 503 it can raise was a value in a response body nobody
    # requested: there was no healthcheck here, health.sh is human-run, and `restart: unless-stopped`
    # cannot act on a degraded service because the process does not exit. See OBS-17.
    #
    # This reports and does not act, deliberately. Compose does not restart a container for failing
    # its healthcheck, and nothing here declares `depends_on: condition: service_healthy`, so the
    # whole effect is that `docker ps` says `(unhealthy)`. Restarting on degraded would be wrong
    # anyway: most reasons are about media already lost or state already unwritten, and a restart
    # drops every live broadcast to re-run a recovery that changes none of it.
    #
    # node rather than curl or wget, because the image is node:22-alpine and has neither. `r.ok` is
    # false for the 503 a degraded service answers, which is the point.
    #
    # Concatenation rather than a template literal because compose interpolates `$` in this file
    # before the container ever sees it: `${process.env.API_PORT||3000}` is read as a variable named
    # `process.env.API_PORT`, and `docker compose config` refuses the file outright. A probe with no
    # `$` in it has nothing to escape and nothing to get wrong.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      # Three consecutive failures, so one dropped segment upload does not flap `docker ps` on its
      # own: SEGMENT_FAILURE_THRESHOLD is 1 and it clears on the next segment that lands.
      retries: 3
      # Long enough for StreamCatalog.init to finish its feed lookup against a cold bee node.
      start_period: 30s

  # --- React Client (viewer) ---

  client:
    image: stream-client
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
      args:
        # Build-time Vite vars — baked into the JS bundle. Per-profile values
        # come from .env.<profile> (loaded by deploy.sh) and `--env-file`.
        VITE_READER_BEE_URL: ${VITE_READER_BEE_URL:-/bee}
        VITE_APP_OWNER: ${VITE_APP_OWNER:-}
        VITE_APP_RAW_TOPIC: ${VITE_APP_RAW_TOPIC:-swarm-stream}
        # ⛔ Leave empty for anything viewers use. See Dockerfile.client.
        VITE_EXPOSE_PLAYER: ${VITE_EXPOSE_PLAYER:-}
        # Empty for the gateway, `weeb3` for an in-tab Swarm node. See Dockerfile.client.
        VITE_BROWSER_FETCH_BACKEND: ${VITE_BROWSER_FETCH_BACKEND:-}
    profiles: ['client']
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '${CLIENT_PORT:-5173}:80'
    environment:
      # Runtime — used by client-nginx.conf.template via envsubst.
      # Default points to the bee-gateway service on the same compose network;
      # override CLIENT_BEE_GATEWAY_HOST/PORT in .env.<profile> to proxy elsewhere.
      BEE_GATEWAY_HOST: ${CLIENT_BEE_GATEWAY_HOST:-bee-gateway}
      BEE_GATEWAY_PORT: ${CLIENT_BEE_GATEWAY_PORT:-${BEE_GATEWAY_API_PORT:-1733}}

  # --- SRS Media Server ---

  srs:
    image: ossrs/srs:6
    profiles: ['srs']
    restart: unless-stopped
    logging: *default-logging
    # Same port on both sides, because the entrypoint now binds SRS to these values rather than to
    # the fixed ones its config used to carry. Mapping a shifted host port onto a fixed container
    # port would leave the mapping pointing at nothing.
    ports:
      - '${SRS_SRT_PORT:-10080}:${SRS_SRT_PORT:-10080}/udp'
      - '${SRS_RTMP_PORT:-1935}:${SRS_RTMP_PORT:-1935}'
      - '${SRS_HTTP_PORT:-8080}:${SRS_HTTP_PORT:-8080}'
      - '${SRS_HTTP_API_PORT:-1985}:${SRS_HTTP_API_PORT:-1985}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../engines/srs/srs.conf.template:/usr/local/srs/conf/srs.conf.template:ro
      - ../engines/srs/entrypoint.sh:/usr/local/srs/conf/entrypoint.sh:ro
      - ../engines/srs/healthcheck.sh:/usr/local/srs/conf/healthcheck.sh:ro
      - srs-media:/usr/local/srs/objs/nginx/html
    entrypoint: ['/bin/bash', '/usr/local/srs/conf/entrypoint.sh']
    # Asks whether a broadcaster could reach this engine, not whether the process is alive. See
    # OBS-20 and the reasoning in `engines/srs/healthcheck.sh`.
    healthcheck:
      test: ['CMD', 'bash', '/usr/local/srs/conf/healthcheck.sh']
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    environment:
      SRT_PASSPHRASE: ${SRT_PASSPHRASE:-}
      SRS_WEBHOOK_TOKEN: ${SRS_WEBHOOK_TOKEN:-}
      SRS_ADAPTER_HOST: ${SRS_ADAPTER_HOST:-stream-uploader}
      SRS_ADAPTER_PORT: ${API_PORT:-3000}
      # Read by the entrypoint to write SRS's own `listen` directives. Without these in the
      # container's environment the substitution falls back to the defaults and host networking
      # ignores the slot, which is the failure this pair exists to prevent.
      SRS_RTMP_PORT: ${SRS_RTMP_PORT:-1935}
      SRS_HTTP_PORT: ${SRS_HTTP_PORT:-8080}
      SRS_SRT_PORT: ${SRS_SRT_PORT:-10080}
      SRS_HTTP_API_PORT: ${SRS_HTTP_API_PORT:-1985}
      # The latency knobs. `main` passed the first two and this branch stopped, which left the
      # entrypoint substituting defaults into a template that no longer had placeholders.
      #
      # ⛔ `HLS_FRAGMENT` is NOT the segment length. Measured over 20 arms and replicated to three
      # decimals, the segment is `ceil(HLS_FRAGMENT / GOP) * GOP`, so the publisher's keyframe
      # interval decides it and the fragment only sets a floor. This was 1.0, which put the floor
      # above the 0.5s GOP that a funded sitting found best and silently produced 1.0s segments for a
      # broadcaster who asked for 0.5s ones. See `docs/bench/gop-vs-fragment-2026-08-12.md`.
      HLS_FRAGMENT: ${HLS_FRAGMENT:-0.5}
      # SRS force-closes a segment at `HLS_FRAGMENT * HLS_AOF_RATIO` regardless of keyframes, so this
      # is the ceiling on the pair rather than a detail.
      #
      # ⛔ The ceiling has to clear `GOP + 0.135s`, not the GOP. Measured 2026-08-12: a segment
      # overshoots its settled length by a **constant ~0.135s** and ramps back down, at every GOP
      # tested. A 2.0s GOP therefore needs 2.135s, and both the old pair (1.0 * 2.1) and #155's
      # (0.5 * 4.2) gave exactly 2.1, which force-closed the common OBS default intermittently:
      # mode 2.117 and spread 1.861-2.219 against a clean 2.000 with room. 5.0 gives **2.5s**, which
      # is the ceiling latbench has run all along. See
      # `docs/bench/shipped-fragment-validation-2026-08-12.md`.
      HLS_AOF_RATIO: ${HLS_AOF_RATIO:-5.0}
      HLS_WINDOW: ${HLS_WINDOW:-15}
      SRT_LATENCY: ${SRT_LATENCY:-200}
      # The ABR ladder, read by the SRS entrypoint. Off by default.
      ABR_ENABLED: ${ABR_ENABLED:-false}
      ABR_LADDER: ${ABR_LADDER:-}
      ABR_VHOST: ${ABR_VHOST:-abr}
      ABR_FPS: ${ABR_FPS:-30}
      ABR_PRESET: ${ABR_PRESET:-veryfast}
      ABR_PROFILE: ${ABR_PROFILE:-main}
      ABR_THREADS: ${ABR_THREADS:-0}
      ABR_ACODEC: ${ABR_ACODEC:-copy}
      ABR_AUDIO_BITRATE: ${ABR_AUDIO_BITRATE:-128}
      ABR_VBV_SECONDS: ${ABR_VBV_SECONDS:-1}
      # Empty on purpose: the entrypoint defaults it to the resolved SRS_RTMP_PORT, the RTMP listener
      # the transcode republish dials. Pinning a fixed port here would re-break the ladder under --portSlot.
      ABR_RTMP_PORT: ${ABR_RTMP_PORT:-}

  # --- OvenMediaEngine ---

  ome:
    image: airensoft/ovenmediaengine:latest
    profiles: ['ome']
    restart: unless-stopped
    logging: *default-logging
    # Host and container port are the same number on purpose, because the entrypoint now binds OME to
    # the configured port rather than to a fixed one. A mapping from a fixed container port hid the
    # fact that these two variables never reached the container at all, which `network_mode: host`
    # then exposed by discarding the mapping. See OPS-30.
    ports:
      - '${OME_SRT_PORT:-10080}:${OME_SRT_PORT:-10080}/udp'
      - '${OME_HLS_PORT:-8081}:${OME_HLS_PORT:-8081}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../engines/ome/Server.xml.template:/opt/ovenmediaengine/conf-template/Server.xml.template:ro
      - ../engines/ome/entrypoint.sh:/opt/ovenmediaengine/conf-template/entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/opt/ovenmediaengine/conf-template/entrypoint.sh']
    environment:
      OME_ADAPTER_HOST: ${OME_ADAPTER_HOST:-stream-uploader}
      OME_ADAPTER_PORT: ${API_PORT:-3000}
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET:-}
      # Without these two the entrypoint cannot bind what the operator configured, which is the whole
      # of OPS-30. They were previously publish mappings only, so the container never saw them.
      OME_SRT_PORT: ${OME_SRT_PORT:-10080}
      OME_HLS_PORT: ${OME_HLS_PORT:-8081}
      HLS_SEGMENT_DURATION: ${HLS_SEGMENT_DURATION:-2}
      HLS_SEGMENT_COUNT: ${HLS_SEGMENT_COUNT:-5}

volumes:
  srs-media:
  uploader-state:
